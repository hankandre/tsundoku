<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>tsundoku</title>
    <script>
      // Flash-free theme init: persisted choice -> system preference -> light.
      (function () {
        try {
          var stored = localStorage.getItem("tsundoku-theme");
          var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          var theme = stored === "dark" || stored === "light" ? stored : prefersDark ? "dark" : "light";
          document.documentElement.setAttribute("data-theme", theme);
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "light");
        }
      })();
    </script>
    %sveltekit.head%
  </head>
  <body class="bg-background text-foreground antialiased font-sans">
    <div id="app" style="display: contents">%sveltekit.body%</div>
  </body>
</html>
